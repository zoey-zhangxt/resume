<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品集 · 张秀婷 Zoey Zhang</title>
<meta name="description" content="张秀婷的作品集 · 知识教研 · AI 协作">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌸%3C/text%3E%3C/svg%3E">
<style>
:root {
  --c-primary: #2c5282;
  --c-primary-light: #4a90d9;
  --c-primary-dark: #1e3a5f;
  --c-text: #1e293b;
  --c-text-soft: #64748b;
  --c-glass: rgba(255, 255, 255, 0.62);
  --c-glass-border: rgba(255, 255, 255, 0.85);
  --shadow-glass: 0 8px 32px rgba(44, 82, 130, 0.08);
  --shadow-glass-hover: 0 16px 44px rgba(44, 82, 130, 0.16);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--c-text);
  line-height: 1.7;
  min-height: 100vh;
  background:
    radial-gradient(1400px 700px at 15% -5%, rgba(207, 228, 245, .9), transparent 65%),
    radial-gradient(1100px 500px at 100% 20%, rgba(74, 144, 217, .16), transparent 65%),
    radial-gradient(900px 400px at 30% 90%, rgba(207, 228, 245, .4), transparent 60%),
    linear-gradient(180deg, #d6e8f6 0%, #eaf3fb 40%, #f4f9fd 100%);
}

/* 顶部导航 */
.site-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(74, 144, 217, 0.1);
}
.site-nav .inner {
  max-width: 1200px; margin: 0 auto;
  padding: 14px 32px;
  display: flex; justify-content: space-between; align-items: center;
}
.site-nav .brand {
  font-size: 16px; font-weight: 700;
  color: var(--c-primary); text-decoration: none; letter-spacing: 1px;
}
.site-nav .links a {
  color: var(--c-text-soft); text-decoration: none;
  margin-left: 28px; font-size: 14.5px;
  transition: color .2s; position: relative;
}
.site-nav .links a:hover { color: var(--c-primary); }
.site-nav .links a.on { color: var(--c-primary); font-weight: 600; }
.site-nav .links a.on::after {
  content: ""; position: absolute;
  left: 0; right: 0; bottom: -6px;
  height: 2px; background: var(--c-primary); border-radius: 2px;
}

/* 页面主区（紧凑，一屏可见） */
.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 130px 32px 40px;
}

/* Hero */
.hero-head {
  text-align: center;
  margin-bottom: 32px;
}
.hero-head .num {
  font-family: "Georgia", serif;
  font-style: italic;
  color: var(--c-primary-light);
  letter-spacing: 3px;
  font-size: 13px;
  margin-bottom: 4px;
}
.hero-head h1 {
  margin: 4px 0 10px;
  font-size: 36px;
  color: var(--c-primary);
  font-weight: 700;
  letter-spacing: 2px;
}
.hero-head .sub {
  color: var(--c-text-soft);
  font-size: 15px;
  line-height: 1.75;
  max-width: 640px;
  margin: 0 auto;
}

/* ---------- 两张横排扁卡 ---------- */
.works-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.work-card {
  display: grid;
  grid-template-columns: 40% 1fr;
  background: var(--c-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--c-glass-border);
  border-radius: 20px;
  box-shadow: var(--shadow-glass);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: all .35s cubic-bezier(.2,.8,.2,1);
  min-height: 260px;
}
.work-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-glass-hover);
  text-decoration: none;
  color: inherit;
}

/* 封面区 */
.work-cover {
  overflow: hidden;
  position: relative;
  background: linear-gradient(135deg, #eaf3fb, #cfe4f5);
  display: flex;
  align-items: center;
  justify-content: center;
}
.work-cover svg {
  width: 100%;
  height: 100%;
  display: block;
  transition: transform .5s;
}
.work-card:hover .work-cover svg { transform: scale(1.05); }

/* 内容区 */
.work-body {
  padding: 22px 26px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
}
.work-num {
  font-family: "Georgia", serif;
  font-style: italic;
  font-size: 12px;
  color: var(--c-primary-light);
  letter-spacing: 4px;
  margin-bottom: -2px;
}
.work-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--c-primary);
  letter-spacing: 1.5px;
  margin: 0;
}
.work-en {
  font-family: "Georgia", serif;
  font-style: italic;
  font-size: 12px;
  color: var(--c-primary-light);
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.work-desc {
  color: var(--c-text);
  font-size: 13px;
  line-height: 1.75;
  margin: 0 0 4px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.work-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 2px 0 10px;
}
.work-tags span {
  padding: 3px 10px;
  background: rgba(74, 144, 217, .1);
  color: var(--c-primary);
  border-radius: 999px;
  font-size: 11.5px;
  border: 1px solid rgba(74, 144, 217, .2);
}
.work-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--c-primary);
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.work-cta::after {
  content: "→";
  transition: transform .3s;
  font-weight: 700;
}
.work-card:hover .work-cta::after { transform: translateX(5px); }

/* 樱花 */
.sakura {
  position: fixed;
  pointer-events: none;
  opacity: .35;
  z-index: 0;
}
.sakura.s1 { top: 15%; right: 5%; transform: rotate(15deg); font-size: 22px; }
.sakura.s2 { bottom: 12%; left: 5%; transform: rotate(-30deg); font-size: 18px; }

/* 移动端 */
@media (max-width: 900px) {
  .page { padding: 100px 20px 40px; }
  .hero-head h1 { font-size: 26px; }
  .works-row { grid-template-columns: 1fr; }
  .work-card { grid-template-columns: 40% 1fr; min-height: 180px; }
  .work-body { padding: 16px 20px; }
  .work-title { font-size: 19px; }
  .site-nav .inner { padding: 12px 20px; }
  .site-nav .links a { margin-left: 18px; font-size: 13px; }
}
@media (max-width: 500px) {
  .site-nav .brand { display: none; }
  .site-nav .links a { margin-left: 12px; }
  .work-card { grid-template-columns: 1fr; }
  .work-cover { min-height: 120px; }
}
</style>
</head>
<body>

<span class="sakura s1">🌸</span>
<span class="sakura s2">🌸</span>

<nav class="site-nav">
  <div class="inner">
    <a href="index.html" class="brand">张秀婷 · Zoey Zhang</a>
    <div class="links">

</nav>

<main class="page">

  <!-- 页面头部 -->
  <header class="hero-head">

      </div>

        <div class="work-tags">

        <span class="work-cta">走进作品</span>
      </div>
    </a>

    <!-- 卡片 2 · AI 协作 -->
    <a class="work-card" href="works-ai.html">
