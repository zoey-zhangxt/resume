<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5eee0"/>
      <stop offset="100%" stop-color="#ede1c8"/>
    </linearGradient>
    <linearGradient id="hlgt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b3201d"/>
      <stop offset="100%" stop-color="#8a1815"/>
    </linearGradient>
    <filter id="shadowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <!-- 米黄底 -->
  <rect width="400" height="300" fill="url(#hb)"/>
  <!-- 顶部标题带 -->
  <text x="200" y="40" text-anchor="middle" font-size="16" font-family="serif" fill="#8a1815" font-weight="700" letter-spacing="2">秦 汉 时 期 · 大 纲 框 架 汇 报</text>
  <line x1="80" y1="52" x2="320" y2="52" stroke="#b3201d" stroke-width="1" opacity="0.5"/>
  <line x1="86" y1="55" x2="314" y2="55" stroke="#b3201d" stroke-width="0.5" opacity="0.4"/>

  <!-- 三段 SKU 时间线 -->
  <g transform="translate(30,90)">
    <!-- 主时间线 -->
    <line x1="0" y1="55" x2="340" y2="55" stroke="#a8442a" stroke-width="1.5" opacity="0.6"/>
    <!-- SKU 1 -->
    <g transform="translate(0,0)" filter="url(#shadowSoft)">
      <rect x="0" y="20" width="100" height="80" fill="#fff" stroke="#c9b48a" stroke-width="1" rx="4"/>
      <text x="50" y="40" text-anchor="middle" font-size="10" fill="#a8442a" font-family="serif" font-weight="700">SKU 1</text>
      <text x="50" y="60" text-anchor="middle" font-size="12" fill="#2c2820" font-weight="600">史前 · 夏商周</text>
      <text x="50" y="80" text-anchor="middle" font-size="10" fill="#6b6358">华夏晨曦</text>
      <text x="50" y="94" text-anchor="middle" font-size="9" fill="#8a1815">从神话到信史</text>
    </g>
    <!-- 箭头 -->
    <text x="110" y="65" font-size="14" fill="#a8442a" font-weight="700">→</text>
    <!-- SKU 2 -->
    <g transform="translate(120,0)" filter="url(#shadowSoft)">
      <rect x="0" y="20" width="100" height="80" fill="#fff" stroke="#c9b48a" stroke-width="1" rx="4"/>
      <text x="50" y="40" text-anchor="middle" font-size="10" fill="#a8442a" font-family="serif" font-weight="700">SKU 2</text>
      <text x="50" y="60" text-anchor="middle" font-size="12" fill="#2c2820" font-weight="600">春秋战国</text>
      <text x="50" y="80" text-anchor="middle" font-size="10" fill="#6b6358">大争之世</text>
      <text x="50" y="94" text-anchor="middle" font-size="9" fill="#8a1815">550 年角逐</text>
    </g>
    <!-- 箭头 -->
    <text x="230" y="65" font-size="14" fill="#a8442a" font-weight="700">→</text>
    <!-- SKU 3（本次汇报） -->
    <g transform="translate(240,0)">
      <!-- 高光背景 -->
      <rect x="-2" y="18" width="104" height="84" fill="url(#hlgt)" rx="5"/>
      <rect x="0" y="20" width="100" height="80" fill="#fff" stroke="#b3201d" stroke-width="2" rx="4" filter="url(#shadowSoft)"/>
      <!-- 本次汇报 tag -->
      <rect x="20" y="8" width="60" height="14" fill="#b3201d" rx="3"/>
      <text x="50" y="18" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">本次汇报</text>
      <text x="50" y="40" text-anchor="middle" font-size="10" fill="#b3201d" font-family="serif" font-weight="700">SKU 3</text>
      <text x="50" y="60" text-anchor="middle" font-size="13" fill="#b3201d" font-weight="700">秦汉时期</text>
      <text x="50" y="80" text-anchor="middle" font-size="10" fill="#8a1815" font-weight="600">天下一统</text>
      <text x="50" y="94" text-anchor="middle" font-size="9" fill="#8a1815">12 集完整 SKU</text>
    </g>
  </g>

  <!-- 底部文字 -->
  <text x="200" y="245" text-anchor="middle" font-size="11" fill="#6b6358" font-family="serif" letter-spacing="1">文明的萌芽 · 分裂中的角逐 · 第一个大一统时代</text>
  <!-- 底部印章 -->
  <g transform="translate(340,255)">
    <rect x="0" y="0" width="26" height="26" fill="#b3201d" rx="2" opacity="0.9"/>
    <text x="13" y="18" text-anchor="middle" font-size="14" fill="#fff" font-family="serif" font-weight="700">汉</text>
  </g>
  <g transform="translate(34,255)">
    <rect x="0" y="0" width="26" height="26" fill="#b3201d" rx="2" opacity="0.9"/>
    <text x="13" y="18" text-anchor="middle" font-size="14" fill="#fff" font-family="serif" font-weight="700">秦</text>
  </g>
</svg>
