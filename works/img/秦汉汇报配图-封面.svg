<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5eee0"/>
      <stop offset="100%" stop-color="#ede1c8"/>
    </linearGradient>
    <linearGradient id="curCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f1e0"/>
    </linearGradient>
    <filter id="shadowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#hb)"/>
  <text x="200" y="40" text-anchor="middle" font-size="16" font-family="serif" fill="#5a4a30" font-weight="700" letter-spacing="2">秦 汉 时 期 · 大 纲 框 架 汇 报</text>
  <line x1="80" y1="52" x2="320" y2="52" stroke="#a8956b" stroke-width="1" opacity="0.5"/>
  <line x1="86" y1="55" x2="314" y2="55" stroke="#a8956b" stroke-width="0.5" opacity="0.4"/>
  <g transform="translate(30,90)">
    <line x1="0" y1="55" x2="340" y2="55" stroke="#a8956b" stroke-width="1.5" opacity="0.5"/>
    <g transform="translate(0,0)" filter="url(#shadowSoft)">
      <rect x="0" y="20" width="100" height="80" fill="#fff" stroke="#c9b48a" stroke-width="1" rx="4"/>
      <text x="50" y="40" text-anchor="middle" font-size="10" fill="#7a6b4d" font-family="serif" font-weight="700">SKU 1</text>
      <text x="50" y="60" text-anchor="middle" font-size="12" fill="#2c2820" font-weight="600">史前 · 夏商周</text>
      <text x="50" y="80" text-anchor="middle" font-size="10" fill="#6b6358">华夏晨曦</text>
      <text x="50" y="94" text-anchor="middle" font-size="9" fill="#7a6b4d">从神话到信史</text>
    </g>
    <text x="110" y="65" font-size="14" fill="#a8956b" font-weight="700">→</text>
    <g transform="translate(120,0)" filter="url(#shadowSoft)">
      <rect x="0" y="20" width="100" height="80" fill="#fff" stroke="#c9b48a" stroke-width="1" rx="4"/>
      <text x="50" y="40" text-anchor="middle" font-size="10" fill="#7a6b4d" font-family="serif" font-weight="700">SKU 2</text>
      <text x="50" y="60" text-anchor="middle" font-size="12" fill="#2c2820" font-weight="600">春秋战国</text>
      <text x="50" y="80" text-anchor="middle" font-size="10" fill="#6b6358">大争之世</text>
      <text x="50" y="94" text-anchor="middle" font-size="9" fill="#7a6b4d">550 年角逐</text>
    </g>
    <text x="230" y="65" font-size="14" fill="#a8956b" font-weight="700">→</text>
    <g transform="translate(240,0)" filter="url(#shadowSoft)">
      <rect x="0" y="20" width="100" height="80" fill="url(#curCard)" stroke="#7a6b4d" stroke-width="1.5" rx="4"/>
      <text x="50" y="40" text-anchor="middle" font-size="10" fill="#5a4a30" font-family="serif" font-weight="700">SKU 3</text>
      <text x="50" y="60" text-anchor="middle" font-size="13" fill="#2c2820" font-weight="700">秦汉时期</text>
      <text x="50" y="80" text-anchor="middle" font-size="10" fill="#5a4a30" font-weight="600">天下一统</text>
      <text x="50" y="94" text-anchor="middle" font-size="9" fill="#7a6b4d">12 集完整 SKU</text>
    </g>
  </g>
  <text x="200" y="245" text-anchor="middle" font-size="11" fill="#6b6358" font-family="serif" letter-spacing="1">文明的萌芽 · 分裂中的角逐 · 第一个大一统时代</text>
  <g transform="translate(340,255)">
    <rect x="0" y="0" width="26" height="26" fill="#7a6b4d" rx="2" opacity="0.9"/>
    <text x="13" y="18" text-anchor="middle" font-size="14" fill="#fff" font-family="serif" font-weight="700">汉</text>
  </g>
  <g transform="translate(34,255)">
    <rect x="0" y="0" width="26" height="26" fill="#7a6b4d" rx="2" opacity="0.9"/>
    <text x="13" y="18" text-anchor="middle" font-size="14" fill="#fff" font-family="serif" font-weight="700">秦</text>
  </g>
</svg>
