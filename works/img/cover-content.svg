<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="100%" stop-color="#cfe4f5"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a90d9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4a90d9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4a90d9" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <!-- 光晕 -->
  <circle cx="80" cy="60" r="55" fill="#ffffff" opacity="0.55" filter="url(#soft3)"/>
  <circle cx="340" cy="240" r="50" fill="#4a90d9" opacity="0.15" filter="url(#soft3)"/>
  <!-- 传播波纹（从内容出发的扩散圆环，象征"从教研到读者"） -->
  <g transform="translate(140,150)">
    <!-- 内容源：小卡片 -->
    <rect x="-30" y="-22" width="60" height="44" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="1.5"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#2c5282" stroke-width="1.5" opacity="0.65"/>
    <line x1="-20" y1="-2" x2="20" y2="-2" stroke="#2c5282" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="6" x2="14" y2="6" stroke="#2c5282" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="14" x2="10" y2="14" stroke="#2c5282" stroke-width="1" opacity="0.5"/>
    <!-- 扩散波纹 -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#4a90d9" stroke-width="1.4" opacity="0.55"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#4a90d9" stroke-width="1.1" opacity="0.35"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#4a90d9" stroke-width="0.9" opacity="0.2"/>
  </g>
  <!-- 读者：右侧几个小圆代表受众 -->
  <g transform="translate(300,150)">
    <circle cx="0" cy="-40" r="10" fill="#ffffff" stroke="#2c5282" stroke-width="1.4"/>
    <circle cx="0" cy="-40" r="4" fill="#2c5282"/>
    <path d="M -10 -30 Q -10 -20 0 -20 Q 10 -20 10 -30" fill="none" stroke="#2c5282" stroke-width="1.4"/>
    <circle cx="-30" cy="20" r="10" fill="#ffffff" stroke="#2c5282" stroke-width="1.4"/>
    <circle cx="-30" cy="20" r="4" fill="#2c5282"/>
    <path d="M -40 30 Q -40 40 -30 40 Q -20 40 -20 30" fill="none" stroke="#2c5282" stroke-width="1.4"/>
    <circle cx="30" cy="20" r="10" fill="#ffffff" stroke="#2c5282" stroke-width="1.4"/>
    <circle cx="30" cy="20" r="4" fill="#2c5282"/>
    <path d="M 20 30 Q 20 40 30 40 Q 40 40 40 30" fill="none" stroke="#2c5282" stroke-width="1.4"/>
    <circle cx="0" cy="50" r="10" fill="#ffffff" stroke="#2c5282" stroke-width="1.4"/>
    <circle cx="0" cy="50" r="4" fill="#2c5282"/>
    <path d="M -10 60 Q -10 70 0 70 Q 10 70 10 60" fill="none" stroke="#2c5282" stroke-width="1.4"/>
  </g>
  <!-- 樱花点缀 -->
  <g opacity="0.7">
    <circle cx="60" cy="230" r="2.5" fill="#f8b6cf"/>
    <circle cx="70" cy="240" r="2" fill="#f8b6cf"/>
    <circle cx="350" cy="70" r="3" fill="#f8b6cf"/>
  </g>
</svg>
