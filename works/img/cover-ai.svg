<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="100%" stop-color="#cfe4f5"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#2c5282"/>
    </linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  <!-- 光晕 -->
  <circle cx="330" cy="70" r="55" fill="#ffffff" opacity="0.55" filter="url(#soft2)"/>
  <circle cx="70" cy="240" r="45" fill="#4a90d9" opacity="0.16" filter="url(#soft2)"/>
  <!-- 节点网络：中心一个大节点 + 4 个卫星节点，连线代表协作 -->
  <g transform="translate(200,150)">
    <!-- 连线 -->
    <line x1="0" y1="0" x2="-70" y2="-55" stroke="#2c5282" stroke-width="1.4" opacity="0.6"/>
    <line x1="0" y1="0" x2="75" y2="-45" stroke="#2c5282" stroke-width="1.4" opacity="0.6"/>
    <line x1="0" y1="0" x2="-80" y2="45" stroke="#2c5282" stroke-width="1.4" opacity="0.6"/>
    <line x1="0" y1="0" x2="70" y2="55" stroke="#2c5282" stroke-width="1.4" opacity="0.6"/>
    <line x1="-70" y1="-55" x2="75" y2="-45" stroke="#4a90d9" stroke-width="0.8" opacity="0.35" stroke-dasharray="3,3"/>
    <line x1="75" y1="-45" x2="70" y2="55" stroke="#4a90d9" stroke-width="0.8" opacity="0.35" stroke-dasharray="3,3"/>
    <line x1="70" y1="55" x2="-80" y2="45" stroke="#4a90d9" stroke-width="0.8" opacity="0.35" stroke-dasharray="3,3"/>
    <line x1="-80" y1="45" x2="-70" y2="-55" stroke="#4a90d9" stroke-width="0.8" opacity="0.35" stroke-dasharray="3,3"/>
    <!-- 卫星节点 -->
    <circle cx="-70" cy="-55" r="14" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="-70" y="-51" font-size="9" fill="#2c5282" text-anchor="middle" font-weight="700">SOP</text>
    <circle cx="75" cy="-45" r="14" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="75" y="-41" font-size="8" fill="#2c5282" text-anchor="middle" font-weight="700">SKILL</text>
    <circle cx="-80" cy="45" r="14" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="-80" y="49" font-size="8" fill="#2c5282" text-anchor="middle" font-weight="700">教研</text>
    <circle cx="70" cy="55" r="14" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="70" y="59" font-size="8" fill="#2c5282" text-anchor="middle" font-weight="700">Git</text>
    <!-- 中心节点：AI -->
    <circle cx="0" cy="0" r="26" fill="url(#nodeGrad)"/>
    <text x="0" y="5" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="1">AI</text>
    <!-- 中心节点周围光晕 -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#4a90d9" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#4a90d9" stroke-width="1" opacity="0.15"/>
  </g>
  <!-- 樱花点缀 -->
  <g opacity="0.7">
    <circle cx="50" cy="60" r="2.5" fill="#f8b6cf"/>
    <circle cx="358" cy="250" r="3" fill="#f8b6cf"/>
    <circle cx="370" cy="242" r="2" fill="#f8b6cf"/>
  </g>
</svg>
