<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="100%" stop-color="#cfe4f5"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7fd"/>
    </linearGradient>
    <filter id="soft1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg1)"/>
  <!-- 光晕 -->
  <circle cx="80" cy="60" r="60" fill="#ffffff" opacity="0.5" filter="url(#soft1)"/>
  <circle cx="340" cy="240" r="50" fill="#4a90d9" opacity="0.15" filter="url(#soft1)"/>
  <!-- 竹简书卷 -->
  <g transform="translate(200,150)">
    <!-- 卷轴左端 -->
    <ellipse cx="-90" cy="0" rx="10" ry="40" fill="#2c5282"/>
    <rect x="-90" y="-45" width="6" height="90" fill="#1e3a5f"/>
    <!-- 展开的书页 -->
    <rect x="-85" y="-40" width="170" height="80" fill="url(#scrollGrad)" stroke="#4a90d9" stroke-width="1.2" opacity="0.95" rx="2"/>
    <!-- 竖列字线 -->
    <line x1="-70" y1="-30" x2="-70" y2="30" stroke="#2c5282" stroke-width="1" opacity="0.55"/>
    <line x1="-50" y1="-30" x2="-50" y2="30" stroke="#2c5282" stroke-width="1" opacity="0.55"/>
    <line x1="-30" y1="-30" x2="-30" y2="30" stroke="#2c5282" stroke-width="1" opacity="0.55"/>
    <line x1="-10" y1="-30" x2="-10" y2="30" stroke="#2c5282" stroke-width="1" opacity="0.55"/>
    <line x1="10" y1="-30" x2="10" y2="30" stroke="#2c5282" stroke-width="1" opacity="0.55"/>
    <line x1="30" y1="-30" x2="30" y2="30" stroke="#2c5282" stroke-width="1" opacity="0.55"/>
    <line x1="50" y1="-30" x2="50" y2="30" stroke="#2c5282" stroke-width="1" opacity="0.55"/>
    <line x1="70" y1="-30" x2="70" y2="30" stroke="#2c5282" stroke-width="1" opacity="0.55"/>
    <!-- 一个印章 -->
    <rect x="60" y="15" width="16" height="16" fill="#b3201d" opacity="0.85" rx="1"/>
    <text x="68" y="27" font-size="9" fill="#fff" text-anchor="middle" font-family="serif">印</text>
    <!-- 卷轴右端 -->
    <ellipse cx="90" cy="0" rx="10" ry="40" fill="#2c5282"/>
    <rect x="84" y="-45" width="6" height="90" fill="#1e3a5f"/>
  </g>
  <!-- 樱花点缀 -->
  <g opacity="0.7">
    <circle cx="60" cy="220" r="3" fill="#f8b6cf"/>
    <circle cx="70" cy="230" r="2" fill="#f8b6cf"/>
    <circle cx="340" cy="70" r="2.5" fill="#f8b6cf"/>
  </g>
</svg>
